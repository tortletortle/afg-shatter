name: V0.16 physics validation

on:
  push:
    branches:
      - v0.16-persistent-warm-start

jobs:
  physics-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run V0.16 deterministic physics harness
        run: node tests/v16_warm_start_harness.js
